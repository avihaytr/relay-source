# SPDX-License-Identifier: MPL-2.0
[package]
name = "relay"
version = "0.1.0-alpha.1"
edition = "2024"
# Source scope and separate branding exclusions: LICENSING.md.
license = "MPL-2.0"

[dependencies]
egui = "0.33.3"
egui-winit = "0.33.3"
egui-wgpu = "0.33.3"
winit = "0.30.13"
wgpu = "27.0.1"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
qrcode = { version = "0.14", default-features = false }
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling"] }
cpal = { version = "0.15", default-features = false }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
libc = "0.2"
subtle = "2.6"
ring = "0.17"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
